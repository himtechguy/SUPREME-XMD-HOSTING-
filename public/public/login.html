
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Admin Login | SUPREME XMD</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #eef3ff;
      background:
        radial-gradient(circle at 20% 15%, #12334a 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #35164b 0, transparent 35%),
        #080b14;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 32px 25px;
      background: rgba(16, 22, 37, 0.96);
      border: 1px solid #26344b;
      border-radius: 18px;
      box-shadow: 0 20px 70px #0008;
    }

    .logo {
      text-align: center;
      color: #35d9f5;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 9px 0 28px;
      color: #9aa9c2;
      text-align: center;
      font-size: 13px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: #cbd6e8;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      color: white;
      background: #0b1120;
      border: 1px solid #34435c;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #35d9f5;
      box-shadow: 0 0 0 2px #35d9f522;
    }

    button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      color: #061019;
      background: linear-gradient(90deg, #35d9f5, #a879ff);
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      color: #ff8295;
      text-align: center;
      font-size: 13px;
    }

    .footer {
      margin-top: 25px;
      color: #65748e;
      text-align: center;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">SUPREME XMD</div>
    <p class="subtitle">HOSTING CONTROL PANEL · ADMIN ACCESS</p>

    <form id="loginForm">
      <label for="username">Admin username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        maxlength="100"
        required
      >

      <label for="password">Admin password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        maxlength="200"
        required
      >

      <button id="loginButton" type="submit">SIGN IN</button>
      <div id="message" role="alert"></div>
    </form>

    <div class="footer">SECURE ADMIN AREA · SUPREME XMD</div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    async function checkExistingLogin() {
      try {
        const response = await fetch("/api/auth/me");
        const data = await response.json();

        if (data.authenticated) {
          window.location.replace("/");
        }
      } catch (error) {
        message.textContent = "Could not connect to the server.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "SIGNING IN...";
      message.textContent = "";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent = data.message || "Login failed.";
          return;
        }

        window.location.replace("/");
      } catch (error) {
        message.textContent = "Server connection failed. Try again.";
      } finally {
        button.disabled = false;
        button.textContent = "SIGN IN";
      }
    });

    checkExistingLogin();
  </script>
</body>
</html>
